topics:

  - topic: /xtend/depth_m
    type: sensor_msgs/msg/Image
    queue_size: 5
    qos:
      history: keep_last
      depth: 5
      reliability: reliable
      durability: volatile

  - topic: /xtend/camera_info
    type: sensor_msgs/msg/CameraInfo
    queue_size: 5
    qos:
      history: keep_last
      depth: 5
      reliability: reliable
      durability: volatile

  - topic: /flow_depth/pose_est
    type: geometry_msgs/msg/PoseStamped
    queue_size: 10
    qos:
      history: keep_last
      depth: 10
      reliability: reliable
      durability: volatile
# ============================================================
# falcon_docker/rosconsole.conf
#
# Silences INFO-level logs from FALCON nodes (the per-cycle
# Hgrid/FSM/TrajServer prints). WARN and ERROR still show
# so you'll still see crashes, replans, and slow-traj warnings.
#
# To activate, add to gazebo_exploration.launch (BEFORE the
# <node> tags):
#
#   <env name="ROSCONSOLE_CONFIG_FILE"
#        value="/catkin_ws/src/falcon_adapter/config/rosconsole.conf" />
#
# Then mount this file into the container from run_hospital.sh:
#
#   --volume "${SCRIPT_DIR}/rosconsole.conf:/catkin_ws/src/falcon_adapter/config/rosconsole.conf"
# ============================================================

# Default for everything: WARN (suppresses INFO, shows WARN+ERROR+FATAL)
log4j.logger.ros=WARN

# Keep adapter + bev_publisher at INFO (they already print only
# one startup line each, which is useful).
log4j.logger.ros.falcon_adapter=INFO
log4j.logger.ros.bev_publisher=INFO